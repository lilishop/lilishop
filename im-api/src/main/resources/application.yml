# ===================================================================
# Lilishop 客服即时通讯服务主配置文件 (im-api)
# 作用说明：
# 1. 负责商城在线客服系统 (IM) 相关的接口与 WebSocket 长连接接入
# 2. 支持买家咨询、商家坐席接待、坐席分流、聊天消息存储与推送
# ===================================================================

# -------------------------------------------------------------------
# Web 容器与网络服务配置
# -------------------------------------------------------------------
server:
  # HTTP 与 WebSocket 服务监听端口
  port: 8885

  servlet:
    # 根上下文访问路径
    context-path: /

  tomcat:
    # 请求 URI 字符编码
    uri-encoding: UTF-8
    threads:
      # Tomcat 工作线程池：最小空闲预留线程数
      min-spare: 50
      # Tomcat 工作线程池：最大并发工作线程数
      max: 1000

# -------------------------------------------------------------------
# Spring Boot Actuator 服务监控配置
# -------------------------------------------------------------------
# actuator 仅暴露健康检查端点，保障生产环境安全性
management:
  endpoints:
    web:
      exposure:
        # 仅公开健康检查健康端点 (/actuator/health)
        include: health

# -------------------------------------------------------------------
# Spring 基础组件与中间件配置
# -------------------------------------------------------------------
spring:
  application:
    # 应用程序名称
    name: im-api

  cache:
    # 默认缓存实现类型：Redis
    type: redis

  # Redis 缓存与分布式锁连接配置
  data:
    redis:
      # Redis 服务器地址
      host: 192.168.31.100
      # Redis 端口
      port: 30379
      # Redis 认证密码
      password: lilishop

  # HTTP 文件上传大小限制
  servlet:
    multipart:
      # 允许上传的单文件最大大小（客服对话中发送的图片/视频）
      max-file-size: 20MB
      # 单次请求允许上传的总数据大小
      max-request-size: 20MB

  # Jackson JSON 序列化与反序列化配置
  jackson:
    # 日期序列化时区（东八区）
    time-zone: GMT+8
    serialization:
      # 允许空对象（Java Bean 没有属性时）序列化，避免抛出异常
      fail-on-empty-beans: false

  # 主数据库连接池配置（阿里巴巴 Druid 连接池）
  datasource:
    # MySQL 数据库 JDBC 连接串
    url: jdbc:mysql://192.168.31.100:3306/lilishop?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    # 数据库登录用户名
    username: root
    # 数据库登录密码
    password: lilishop
    # MySQL 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池类型
    type: com.alibaba.druid.pool.DruidDataSource

# -------------------------------------------------------------------
# 安全认证：白名单 URL 配置（忽略鉴权，无需携带 Token 即可访问）
# -------------------------------------------------------------------
ignored:
  urls:
    - /editor-app/**
    - /MP_verify_qSyvBPhDsPdxvOhC.txt
    - /weixin/**
    - /source/**
    - /manager/passport/user/login
    - /manager/passport/user/refresh/**
    - /manager/other/customWords
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs
    - /v3/api-docs/**

# -------------------------------------------------------------------
# Swagger 接口文档基本信息配置
# -------------------------------------------------------------------
swagger:
  title: lili API接口文档
  description: lili Api Documentation
  version: 1.0.0
  termsOfServiceUrl: https://pickmall.cn
  contact:
    name: lili
    url: https://pickmall.cn
    email: admin@pickmall.com

# -------------------------------------------------------------------
# MyBatis-Plus ORM 框架配置
# -------------------------------------------------------------------
mybatis-plus:
  # XML 映射文件加载路径
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 是否开启二级缓存
    cache-enabled: true
    # 日志输出（按需放开）
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# -------------------------------------------------------------------
# 系统日志配置（基于 Logback）
# -------------------------------------------------------------------
logging:
  # 外部 Logback 配置文件路径
  config: classpath:logback-spring.xml
  level:
    # 核心包日志输出级别
    cn.lili: info
  file:
    # 日志输出根目录
    path: lili-logs

# -------------------------------------------------------------------
# SpringDoc (OpenAPI 3 / Swagger) 接口文档配置
# -------------------------------------------------------------------
springdoc:
  api-docs:
    # 是否开启 API 元数据导出
    enabled: true
  swagger-ui:
    # 是否开启 Swagger 交互式网页文档
    enabled: true
    # 文档访问路径
    path: /swagger-ui/index.html
  # 控制器扫描包路径
  packages-to-scan: cn.lili.controller
  # 匹配路径规则
  paths-to-match:
    - /im/**
    - /store/**
  override-with-generic-response: false
  logback:
    rollingpolicy:
      # 日志最大保存天数
      max-history: 7
      # 单个日志文件最大大小
      max-file-size: 5MB

# -------------------------------------------------------------------
# Jasypt 敏感属性加密密钥配置
# -------------------------------------------------------------------
jasypt:
  encryptor:
    # 加密/解密私钥
    password: lili

# -------------------------------------------------------------------
# Lilishop 客服系统核心业务配置
# -------------------------------------------------------------------
lili:
  # 演示站及脱敏规则配置
  system:
    # 是否演示站点
    isDemoSite: true
    # 数据脱敏级别：
    # 0：不做脱敏处理
    # 1：管理端用户手机号等敏感信息脱敏
    # 2：商家端信息脱敏（为 2 时，表示管理端、商家端同时脱敏）
    sensitiveLevel: 1

  # 在线会员人数统计设置
  statistics:
    # 在线人数统计 X 小时：这里设为 48，即统计过去 48 小时每小时在线人数
    onlineMember: 48
    # 当前在线人数刷新时间间隔（单位：秒）：设置为 600，则每 10 分钟刷新一次
    currentOnlineUpdate: 600


  # JWT 身份鉴权令牌配置
  jwt-setting:
    # 令牌签名密钥（生产环境建议通过环境变量 LILI_JWT_SECRET 强制覆盖）
    secret: ${LILI_JWT_SECRET:cuAihCz53DZRjZwbsGcZJ2Ai6At+T142uphtJMsk7iQ=}
    # 客服端 Token 访问令牌有效时间（单位：分钟），60 分钟
    tokenExpireTime: 60

  # Spring Cache 默认缓存过期配置
  cache:
    # 缓存过期时间（单位：秒）；永久不过期设为 -1
    timeout: 1500

  # 异步多线程执行线程池配置
  thread:
    # 核心线程数
    corePoolSize: 5
    # 最大线程数
    maxPoolSize: 50
    # 等待队列容量
    queueCapacity: 50

  # RocketMQ 分布式消息队列主题 (Topic) 与消费组 (Group) 配置
  data:
    rocketmq:
      # 促销活动相关主题与消费组
      promotion-topic: lili_promotion_topic
      promotion-group: lili_promotion_group
      # 商品变动相关主题与消费组
      goods-topic: lili_goods_topic
      goods-group: lili_goods_group
      # 订单交易相关主题与消费组
      order-topic: lili_order_topic
      order-group: lili_order_group
      # 会员用户相关主题与消费组
      member-topic: lili_member_topic
      member-group: lili_member_group
      # 店铺/商家相关主题与消费组
      store-topic: lili_store_topic
      store-group: lili_store_group
      # 站内公告通知相关主题与消费组
      notice-topic: lili_notice_topic
      notice-group: lili_notice_group
      # 消息发送相关主题与消费组
      notice-send-topic: lili_send_notice_topic
      notice-send-group: lili_send_notice_group
      # 售后/退款退货相关主题与消费组
      after-sale-topic: lili_after_sale_topic
      after-sale-group: lili_after_sale_group
