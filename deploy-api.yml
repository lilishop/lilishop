apiVersion: v1
kind: Namespace
metadata:
  name: lilishop-service

---
# 买家端 API — 8888
apiVersion: v1
kind: Service
metadata:
  name: buyer-api-service
  namespace: lilishop-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: http
  selector:
    lilishop.service: buyer-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buyer-api
  namespace: lilishop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      lilishop.service: buyer-api
  template:
    metadata:
      labels:
        lilishop.service: buyer-api
    spec:
      containers:
        - image: buyer-api:latest
          name: buyer-api
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: TZ
              value: Asia/Shanghai

---
# 平台 + 商家 API — 8887
apiVersion: v1
kind: Service
metadata:
  name: manager-api-service
  namespace: lilishop-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8887
      targetPort: http
  selector:
    lilishop.service: manager-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager-api
  namespace: lilishop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      lilishop.service: manager-api
  template:
    metadata:
      labels:
        lilishop.service: manager-api
    spec:
      containers:
        - image: manager-api:latest
          name: manager-api
          ports:
            - name: http
              containerPort: 8887
          env:
            - name: TZ
              value: Asia/Shanghai

---
# IM / 客服 — 8885
apiVersion: v1
kind: Service
metadata:
  name: im-api-service
  namespace: lilishop-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8885
      targetPort: http
  selector:
    lilishop.service: im-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: im-api
  namespace: lilishop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      lilishop.service: im-api
  template:
    metadata:
      labels:
        lilishop.service: im-api
    spec:
      containers:
        - image: im-api:latest
          name: im-api
          ports:
            - name: http
              containerPort: 8885
          env:
            - name: TZ
              value: Asia/Shanghai

---
# 共享配置片段（各服务通过 ConfigMap 挂载或 spring.config.import 引用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: lilishop-shared-config
  namespace: lilishop-service
data:
  middleware.yml: |
    spring:
      data:
        redis:
          host: redis-service.lilishop-middleware
          port: 6379
          password: lilishop
      datasource:
        url: jdbc:mysql://mysql.lilishop-middleware:3306/lilishop?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        username: root
        password: lilishop
        driver-class-name: com.mysql.cj.jdbc.Driver
    lili:
      data:
        rocketmq:
          promotion-topic: lili_promotion_topic
          promotion-group: lili_promotion_group
          goods-topic: lili_goods_topic
          goods-group: lili_goods_group
          order-topic: lili_order_topic
          order-group: lili_order_group
          member-topic: lili_member_topic
          member-group: lili_member_group
          store-topic: lili_store_topic
          store-group: lili_store_group
          notice-topic: lili_notice_topic
          notice-group: lili_notice_group
          notice-send-topic: lili_send_notice_topic
          notice-send-group: lili_send_notice_group
          after-sale-topic: lili_after_sale_topic
          after-sale-group: lili_after_sale_group
      schedule:
        every-minute-cron: "0 * * * * ?"
        every-hour-cron: "0 0 * * * ?"
        every-day-cron: "0 0 0 * * ?"
      message:
        consumer:
          enabled: true
  buyer-security-reference.yml: |
    # 若线上 buyer-api 出现 /buyer/common/* 403，请确认 ignored.urls 包含以下路径后重启服务
    ignored:
      urls:
        - /buyer/common/slider/**
        - /buyer/common/sms/**
        - /buyer/common/site/**
        - /buyer/common/region/**
        - /buyer/common/IM
