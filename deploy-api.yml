apiVersion: v1
kind: Namespace
metadata:
  name: lilishop-service

---
apiVersion: v1
kind: Service
metadata:
  name: lilishop-all-service
  namespace: lilishop-service
  labels:
    app.kubernetes.io/name: lilishop-all-service
    app.kubernetes.io/instance: lilishop-all
    app.kubernetes.io/component: all-in-one-api
    app.kubernetes.io/part-of: lilishop
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    lilishop.service: lilishop-all

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lilishop-all-config
  namespace: lilishop-service
  labels:
    app.kubernetes.io/name: lilishop-all-config
    app.kubernetes.io/instance: lilishop-all
    app.kubernetes.io/component: all-in-one-api
    app.kubernetes.io/part-of: lilishop
data:
  application.yml: |
    server:
      port: 8080
      servlet:
        context-path: /
      tomcat:
        uri-encoding: UTF-8
        threads:
          min-spare: 50
          max: 1000

    management:
      endpoints:
        web:
          exposure:
            include: '*'

    spring:
      data:
        redis:
          host: redis-service.lilishop-middleware
          port: 6379
          password: lilishop
      datasource:
        url: jdbc:mysql://mysql.lilishop-middleware:3306/lilishop?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        username: root
        password: lilishop
        driver-class-name: com.mysql.cj.jdbc.Driver

    lili:
      system:
        isDemoSite: false
      local-file:
        path: data/uploads
        url-prefix: /files
      data:
        elasticsearch:
          enabled: true
          cluster-nodes: elasticsearch.lilishop-middleware:9200
          schema: http
        logstash:
          server: logstash-service.lilishop-middleware:4560
        rocketmq:
          promotion-topic: lili_promotion_topic
          promotion-group: lili_promotion_group
          goods-topic: lili_goods_topic
          goods-group: lili_goods_group
          order-topic: lili_order_topic
          order-group: lili_order_group
          member-topic: lili_member_topic
          member-group: lili_member_group
          store-topic: lili_store_topic
          store-group: lili_store_group
          notice-topic: lili_notice_topic
          notice-group: lili_notice_group
          notice-send-topic: lili_send_notice_topic
          notice-send-group: lili_send_notice_group
          after-sale-topic: lili_after_sale_topic
          after-sale-group: lili_after_sale_group

    rocketmq:
      name-server: rocketmq.lilishop-middleware:9876
      producer:
        group: lili_group
        send-message-timeout: 30000

    xxl:
      job:
        admin:
          addresses: http://xxl-job-service.lilishop-middleware:9001/xxl-job-admin
        executor:
          appname: xxl-job-executor-lilishop
          logpath: ./xxl-job/executor
          logretentiondays: 7

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lilishop-all
  namespace: lilishop-service
  labels:
    app.kubernetes.io/name: lilishop-all-service
    app.kubernetes.io/instance: lilishop-all
    app.kubernetes.io/component: all-in-one-api
    app.kubernetes.io/part-of: lilishop
spec:
  replicas: 1
  selector:
    matchLabels:
      lilishop.service: lilishop-all
  template:
    metadata:
      labels:
        lilishop.service: lilishop-all
    spec:
      containers:
        - image: lilishop-all:latest
          name: lilishop-all
          args:
            - --spring.profiles.active=dev
            - --spring.config.additional-location=file:/application.yml
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: JAVA_OPTS
              value: -Xms512m -Xmx1024m
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - mountPath: /application.yml
              name: application-yml
              subPath: application.yml
      restartPolicy: Always
      volumes:
        - configMap:
            name: lilishop-all-config
          name: application-yml
