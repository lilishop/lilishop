# ===================================================================
# 管理端测试专用配置文件 (manager-api/src/test/resources/application.yml)
# 作用说明：
# 供 manager-api 单元测试与集成测试环境加载执行
# ===================================================================

server:
  servlet:
    context-path: /

  tomcat:
    uri-encoding: UTF-8
    threads:
      min-spare: 50
      max: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
spring:

  cache:
    type: redis
  # Redis
  redis:
    host: 192.168.0.108
    port: 30379
    password: lilishop
    lettuce:
      pool:
        # 连接池最大连接数（使用负值表示没有限制） 默认 8
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认 -1
        max-wait: 20
        # 连接池中的最大空闲连接，默认 8
        max-idle: 10
        # 连接池中的最小空闲连接，默认 8
        min-idle: 8
  # 文件大小上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    serialization:
      # 关闭 jackson 对 json 做解析
      fail-on-empty-beans: false

  datasource:
    url: jdbc:mysql://192.168.0.108:30306/lilishop?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: lilishop
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

# 忽略鉴权url
ignored:
  urls:
    - /editor-app/**
    - /weixin/**
    - /source/**
    - /manager/passport/user/login
    - /manager/passport/user/refresh/**
    - /manager/other/customWords
    - /swagger-ui.html
    - /swagger-ui
    - /swagger-ui/
    - /swagger-ui/**
    - /v3/api-docs/**
    - /favicon.ico
    - /files/**
    - /static/**
    - /public/**
    - /resources/**
    - /META-INF/resources/**

# Swagger界面内容配置
swagger:
  title: lilishop API接口文档
  description: lilishop Api Documentation
  version: 4.2.2
  termsOfServiceUrl: https://pickmall.cn
  contact:
    name: lili
    url: https://pickmall.cn
    email: admin@pickmall.com

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Mybatis-plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 缓存开启
    cache-enabled: true

# 日志
logging:
  level:
    cn.lili: info
  file:
    path: logs
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 5MB

# 加密参数
jasypt:
  encryptor:
    password: lili


lili:

  statistics:
    # 在线人数统计 X 小时：设为 48，即统计过去 48 小时每小时在线人数
    onlineMember: 48
    # 当前在线人数刷新时间间隔，单位秒
    currentOnlineUpdate: 600

  # JWT 细节设定
  jwt-setting:
    # 令牌签名密钥
    secret: ${LILI_JWT_SECRET:cuAihCz53DZRjZwbsGcZJ2Ai6At+T142uphtJMsk7iQ=}
    # Token 过期时间（分钟）
    tokenExpireTime: 30

  # 使用 Spring @Cacheable 注解失效时间
  cache:
    # 过期时间 单位秒
    timeout: 1500
  # 多线程配置
  thread:
    corePoolSize: 5
    maxPoolSize: 50
    queueCapacity: 50
  data:
    rocketmq:
      promotion-topic: lili_promotion_topic
      promotion-group: lili_promotion_group
      goods-topic: lili_goods_topic
      goods-group: lili_goods_group
      order-topic: lili_order_topic
      order-group: lili_order_group
      member-topic: lili_member_topic
      member-group: lili_member_group
      notice-topic: lili_notice_topic
      notice-group: lili_notice_group
      notice-send-topic: lili_send_notice_topic
      notice-send-group: lili_send_notice_group
      after-sale-topic: lili_after_sale_topic
      after-sale-group: lili_after_sale_group
