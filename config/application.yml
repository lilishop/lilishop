# -------------------------------------------------------------------
# Swagger 接口文档基本信息配置
# -------------------------------------------------------------------
swagger:
  title: lilishop API接口文档
  description: lilishop Api Documentation
  version: 4.2.2
  termsOfServiceUrl: https://pickmall.cn
  contact:
    name: lili
    url: https://pickmall.cn
    email: admin@pickmall.com

# -------------------------------------------------------------------
# SpringDoc 接口文档通用配置
# -------------------------------------------------------------------
springdoc:
  swagger-ui:
    # 是否开启 Swagger UI 界面
    enabled: true
    # 文档访问入口
    path: /swagger-ui.html

# -------------------------------------------------------------------
# MyBatis-Plus ORM 框架配置
# -------------------------------------------------------------------
mybatis-plus:
  # XML 映射文件加载路径
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 是否开启二级缓存
    cache-enabled: true
    # 日志输出（按需放开）
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# -------------------------------------------------------------------
# 系统日志配置（基于 Logback）
# -------------------------------------------------------------------
logging:
  level:
    # 核心包日志输出级别
    cn.lili: info
  file:
    # 日志输出根目录
    path: logs
  logback:
    rollingpolicy:
      # 日志最大保存天数
      max-history: 7
      # 单个日志文件最大大小
      max-file-size: 5MB

# -------------------------------------------------------------------
# Jasypt 敏感属性加密密钥配置
# -------------------------------------------------------------------
jasypt:
  encryptor:
    # 加密/解密私钥
    password: lili

# -------------------------------------------------------------------
# Lilishop 商城平台通用业务配置
# -------------------------------------------------------------------
lili:
  # 演示站及脱敏规则配置
  system:
    # 是否演示站点
    isDemoSite: false
    # 数据脱敏级别：
    # 0：不做脱敏处理
    # 1：管理端用户手机号等敏感信息脱敏
    # 2：商家端信息脱敏（为 2 时，表示管理端、商家端同时脱敏）
    sensitiveLevel: 1

  # 本地文件存储配置
  local-file:
    # 本地上传文件保存目录
    path: data/uploads
    # 静态文件访问的 URL 前缀
    url-prefix: /files

  # 在线会员人数统计设置
  statistics:
    # 在线人数统计 X 小时：这里设为 48，即统计过去 48 小时每小时在线人数
    onlineMember: 48
    # 当前在线人数刷新时间间隔（单位：秒）：设置为 600，则每 10 分钟刷新一次
    currentOnlineUpdate: 600


  # JWT 身份鉴权令牌配置
  jwt-setting:
    # 令牌过期时间（分钟）
    tokenExpireTime: 10000

  # Spring Cache 默认缓存过期配置
  cache:
    # 缓存过期时间（单位：秒）；永久不过期设为 -1
    timeout: 1500

  # 异步多线程执行线程池配置
  thread:
    # 核心线程数
    corePoolSize: 5
    # 最大线程数
    maxPoolSize: 50
    # 等待队列容量
    queueCapacity: 50

  # RocketMQ 分布式消息队列主题 (Topic) 与消费组 (Group) 配置
  data:
    rocketmq:
      # 促销活动相关主题与消费组
      promotion-topic: lili_promotion_topic
      promotion-group: lili_promotion_group
      # 商品变动相关主题与消费组
      goods-topic: lili_goods_topic
      goods-group: lili_goods_group
      # 订单交易相关主题与消费组
      order-topic: lili_order_topic
      order-group: lili_order_group
      # 会员用户相关主题与消费组
      member-topic: lili_member_topic
      member-group: lili_member_group
      # 店铺/商家相关主题与消费组
      store-topic: lili_store_topic
      store-group: lili_store_group
      # 站内公告通知相关主题与消费组
      notice-topic: lili_notice_topic
      notice-group: lili_notice_group
      # 消息发送相关主题与消费组
      notice-send-topic: lili_send_notice_topic
      notice-send-group: lili_send_notice_group
      # 售后/退款退货相关主题与消费组
      after-sale-topic: lili_after_sale_topic
      after-sale-group: lili_after_sale_group
