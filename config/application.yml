# ===================================================================
# Lilishop 全局通用集中配置模板 (config/application.yml)
# 作用说明：
# 1. 集中定义平台全部微服务通用的基础配置模板（供配置中心 Nacos/Config 或外部化加载参考）
# 2. 覆盖公共数据库连接、Redis 缓存、白名单路由等公用项
# ===================================================================

# -------------------------------------------------------------------
# Web 容器与网络服务通用配置
# -------------------------------------------------------------------
server:
  servlet:
    # 根上下文访问路径
    context-path: /

  tomcat:
    # 请求 URI 字符编码
    uri-encoding: UTF-8
    threads:
      # Tomcat 工作线程池：最小空闲预留线程数
      min-spare: 50
      # Tomcat 工作线程池：最大并发工作线程数
      max: 1000

# -------------------------------------------------------------------
# Spring Boot Actuator 服务监控配置
# -------------------------------------------------------------------
# actuator 仅暴露健康检查端点，保障生产环境安全性
management:
  endpoints:
    web:
      exposure:
        # 仅公开健康检查健康端点 (/actuator/health)
        include: health

# -------------------------------------------------------------------
# Spring 基础组件与中间件通用配置
# -------------------------------------------------------------------
spring:
  cache:
    # 默认缓存实现类型：Redis
    type: redis

  # Redis 缓存与分布式锁连接配置
  data:
    redis:
      # Redis 服务器地址
      host: 192.168.31.100
      # Redis 端口
      port: 30379
      # Redis 认证密码
      password: lilishop
      # 读取超时时间
      timeout: 10s
      # 建立连接超时时间
      connect-timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制，默认 8）
          max-active: 200
          # 连接池最大阻塞等待时间（默认 20s）
          max-wait: 20s
          # 连接池中的最大空闲连接，默认 8
          max-idle: 10
          # 连接池中的最小空闲连接，默认 8
          min-idle: 8

  # HTTP 文件上传大小限制
  servlet:
    multipart:
      # 允许上传的单文件最大大小
      max-file-size: 20MB
      # 单次请求允许上传的总数据大小
      max-request-size: 20MB

  # Jackson JSON 序列化配置
  jackson:
    # 日期序列化时区（东八区）
    time-zone: GMT+8
    serialization:
      # 允许空对象序列化
      fail-on-empty-beans: false

  # 主数据库连接池配置（阿里巴巴 Druid 连接池）
  datasource:
    # MySQL 数据库 JDBC 连接串
    url: jdbc:mysql://192.168.31.100:3306/lilishop?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    # 数据库登录用户名
    username: root
    # 数据库登录密码
    password: lilishop
    # MySQL 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池类型
    type: com.alibaba.druid.pool.DruidDataSource

